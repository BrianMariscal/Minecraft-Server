# ===========================================================================
#  CoreProtect — mensajes en español de México
# ===========================================================================
#  CoreProtect no trae NINGÚN idioma más que inglés (verificado en el jar
#  24.1). Esta es nuestra traducción completa.
#  La copia `mc build` a plugins/CoreProtect/language.yml.
#
#  Sintaxis que hay que respetar:
#    {0}, {1}, {2}   -> los rellena CoreProtect, no los muevas de orden
#                       salvo que la frase en español lo pida.
#    {uno|varios}    -> CoreProtect elige según la cantidad (singular/plural)
#                       o según la acción. El ORDEN de las opciones importa.
#
#  Casi todo esto lo ve solo quien administra (los comandos /co piden
#  permiso), pero igual va completo y en español.
# ===========================================================================

