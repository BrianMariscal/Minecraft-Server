  disable_success: '&aApagué tu modo premium. Vuelves a entrar con contraseña.'
  error: '&cAlgo falló al revisar tu cuenta premium. Intenta más tarde.'
  admin:
    not_registered: '&c%name no está registrado.'
    already_enabled: '&e%name ya tiene el modo premium prendido.'
    account_not_found: '&cNo encontré ninguna cuenta de Mojang para %name.'
    enable_success: '&aPrendí el modo premium de %name.'
    not_enabled: '&e%name no tiene el modo premium prendido.'
    disable_success: '&aApagué el modo premium de %name.'
    impostor_kicked: '&eAlguien entró como %name con otro UUID y lo saqué.'
