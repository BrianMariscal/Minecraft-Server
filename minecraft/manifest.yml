# ===========================================================================
#  Plugins y datapacks de Minecraft HD — todo fijado y verificable
# ===========================================================================
#  Cada entrada trae nombre, version, archivo, url y sha256. `mc build`
#  descarga, compara el sha256 y SOLO entonces copia el archivo a su lugar.
#  Si un sha256 no coincide, el build falla: o cambiaron el archivo arriba,
#  o la descarga se corrompio. Nunca se instala algo sin verificar.
#
#  Todo esto se resolvio y se verifico el 2026-09-30 contra Minecraft 26.1.2.
#  Para revisar si hay versiones nuevas: `mc update`.
#
#  NO edites este archivo a mano para subir una version: usa `mc update`,
#  que recalcula el sha256 por ti y te muestra que cambiaria antes de aplicar.
# ===========================================================================

# Version de Minecraft contra la que se verifico esta lista.
