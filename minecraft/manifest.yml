# ---------------------------------------------------------------------------
#  Vanilla Tweaks
# ---------------------------------------------------------------------------
#  vanillatweaks.net no da URLs fijas: hay que mandar un POST con la lista de
#  packs y te devuelve un link con un id aleatorio. Lo bueno es que el ZIP que
#  entrega SI es byte a byte identico en cada generacion (verificado el
#  2026-09-30 generandolo dos veces), asi que su sha256 si se puede fijar.
#
#  `mc build` manda el POST, baja el ZIP, verifica `sha256_zip`, lo descomprime
#  y verifica el sha256 de cada datapack de adentro contra `packs`. Si cualquiera
#  falla, no se instala nada.
#
#  Dos packs que pediste NO existen para 26.x y quedaron fuera:
#    - "invisible item frames": ya no esta ni en datapacks ni en crafting tweaks.
#    - "right click harvest": ya no lo publican.
#  Ver docs/versiones.md.
vanilla_tweaks:
  version_mc: "26.1"
  url: "https://vanillatweaks.net/assets/server/zipdatapacks.php"
  # Cuerpo exacto del POST. El orden importa para que el ZIP salga identico.
  seleccion:
    "Decorative/Cosmetic":
      - "armor statues"
      - "more mob heads"
      - "wandering trades"
    "Gameplay Changes":
      - "anti enderman grief"
    "Convenience":
      - "timber"
  # sha256 del ZIP contenedor que devuelve vanillatweaks.net.
  sha256_zip: "b8b1a600e3db506f2ff08c096e186554d98863fa66a8f9c27304b503da326aed"
  # Cada datapack de adentro, con su sha256. El nombre tiene que coincidir
  # exacto: asi detectamos si Vanilla Tweaks subio una version nueva.
  packs:
    - archivo: "armor statues v2.8.22 (MC 26.1).zip"
      sha256: "9fcbb5875c40c7616a9c8200b5db4cef53d9fe157da8b9d4682ad31c8ba2b448"
      nota: "Poses y ajustes finos de armor stands. Funciona en Bedrock por el libro de recetas."
    - archivo: "more mob heads v2.19.1 (MC 26.1).zip"
      sha256: "58f977bda12d097cb66fed3188f3cff1bb303569c740ba47c19d8f0d262e4611"
      nota: "Los mobs sueltan su cabeza al morir."
    - archivo: "wandering trades v1.7.15 (MC 26.1).zip"
      sha256: "1d8daa416b7bd3068377bec9e3ce7efa2c50bb07d4318aa979420374ffd49079"
      nota: "El comerciante errante vende cabezas de jugador y de mob."
    - archivo: "anti enderman grief v1.1.16 (MC 26.1).zip"
      sha256: "f8c39b0ea1147a24f61c7945612ce9332303606ebc5157d4211c149a85ccb0ad"
      nota: "Los endermans dejan de levantar bloques."
    - archivo: "timber v2.1.19 (MC 26.1).zip"
      sha256: "2c1aa2b8105834408679656ce760069e3cebeb08825befd026013daaeb870654"
      nota: "Tala de arbol completo. Datapack en vez de plugin: es vanilla puro, asi que Bedrock lo ve perfecto via Geyser."
