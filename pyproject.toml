# ---------------------------------------------------------------------------
# Raíz del workspace de uv para el proyecto "Minecraft HD".
#
# Este archivo NO es un paquete instalable: solo agrupa los paquetes de
# packages/ y centraliza la configuración de ruff, mypy y pytest para que
# cada paquete herede exactamente las mismas reglas.
# ---------------------------------------------------------------------------
[project]
name = "minecraft-hd"
version = "1.1.0"
description = "Servidor de Minecraft HD: CLI de administración y bot de pagos del VPS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mc-admin",
    "pagos-bot",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
mc-admin = { workspace = true }
pagos-bot = { workspace = true }

[dependency-groups]
# Herramientas de desarrollo compartidas por todo el workspace.
dev = [
    "ruff>=0.14.0",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "types-PyYAML>=6.0.12",
    "pre-commit>=4.0.0",
]

# ---------------------------------------------------------------------------
# ruff: lint + formato. Reemplaza a black, isort y flake8.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/mc_admin/src", "packages/pagos_bot/src"]
extend-exclude = ["minecraft/generated"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort (orden de imports)
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "A",        # builtins sombreados
    "C4",       # comprehensions
    "DTZ",      # datetime sin zona horaria (crítico para el bot de pagos)
    "T20",      # prohíbe print() fuera de la capa CLI
    "SIM",      # simplificaciones
    "PTH",      # usa pathlib en lugar de os.path
    "RUF",      # reglas propias de ruff
    "ANN",      # exige type hints
    "ASYNC",    # errores comunes de asyncio
    "S",        # bandit: seguridad
    "LOG",      # uso correcto de logging
    "G",        # formato de mensajes de logging
    "RET",      # returns redundantes
    "ARG",      # argumentos sin usar
    "TRY",      # manejo de excepciones
]
ignore = [
    "ANN401",   # permitimos Any en firmas de decoradores de Typer/discord.py
    "TRY003",   # mensajes largos en excepciones: los queremos explicativos y en español
    "S101",     # assert: lo usamos en tests
    # EM101/EM102 piden sacar el mensaje a una variable antes de lanzar. Aquí no
    # aplica: nuestras excepciones (ErrorMc y sus hijas) reciben el mensaje como
    # primer argumento por diseño, porque ES el texto que se le muestra al
    # usuario. Obligar a una variable temporal en cada raise solo agrega ruido.
    "EM101",
    "EM102",
    # N818 quiere que las excepciones terminen en "Error". Las nuestras EMPIEZAN
    # con Error porque el código está en español: ErrorDeConfig, ErrorDeRcon.
    "N818",
    # RUF001 se queja de los emojis que usamos en los estados del bot
    # (➖ junto a ✅ 🕓 ❌). Son intencionales: así se ven parejos en Discord.
    "RUF001",
]

[tool.ruff.lint.per-file-ignores]
# La capa CLI es la ÚNICA que puede escribir a la terminal (vía Rich).
"packages/mc_admin/src/mc_admin/cli/*" = ["T20"]
# Los generadores de traducciones son herramientas que se corren a mano
# cuando se actualiza un plugin, no código del servidor. Imprimen a la
# terminal por diseño (es su salida) y no arrastran la ceremonia de tipos
# del resto del proyecto.
# E501 también: estos archivos traen tablas de traducción donde partir una
# línea a la mitad de una frase en español la hace ilegible.
"minecraft/translations/es_mx/herramientas/*" = [
    "T20", "ANN", "PTH", "SIM115", "D", "E501",
]
# En tests relajamos type hints y seguridad.
"packages/*/tests/*" = ["ANN", "S", "ARG", "DTZ"]
# El script de copia corre en la PC, no en el paquete: ejecuta ssh y rsync
# por diseño y reporta a la salida estándar para que quede en el journal.
"deploy/pc/*" = ["S603", "S607", "TRY300", "TRY301"]

[tool.ruff.lint.isort]
known-first-party = ["mc_admin", "pagos_bot"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# mypy en modo estricto para todo el código propio.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true
pretty = true
mypy_path = ["packages/mc_admin/src", "packages/pagos_bot/src"]
explicit_package_bases = true
exclude = ["minecraft/generated"]

[[tool.mypy.overrides]]
# Librerías de terceros sin stubs completos.
module = ["discord.*", "mcrcon.*", "apscheduler.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# --- Los tests se revisan, pero con menos ceremonia ---------------------
#  Siguen pasando por mypy (ahí es donde se atrapan los errores reales),
#  solo les apagamos tres cosas que en un test son ruido y no un bug:
#
#  - `union-attr`: un test hace `mes.cuota_de(1).estado` porque SABE que
#    existe; meter un `assert ... is not None` antes de cada aserción no
#    aporta nada y tapa lo que el test comprueba.
#  - `no-untyped-def`: un test no necesita anotar sus fixtures.
#  - `import-not-found`: `ayudas.py` es un módulo hermano que pytest resuelve
#    poniendo la carpeta de tests en sys.path; mypy no lo sabe.
module = [
    "tests.*",
    "*.tests.*",
    "conftest",
    "ayudas",
]
disallow_untyped_defs = false
disallow_untyped_calls = false
disable_error_code = ["union-attr", "no-untyped-def", "import-not-found", "type-arg"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["packages/mc_admin/tests", "packages/pagos_bot/tests"]
pythonpath = ["packages/mc_admin/src", "packages/pagos_bot/src"]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
filterwarnings = ["error"]

# ---------------------------------------------------------------------------
# Cobertura: el piso no se negocia hacia abajo.
# ---------------------------------------------------------------------------
# El número es el que ya tenía el proyecto cuando se midió por primera vez.
# Si un cambio lo baja, el test falla: así no se pierde cobertura sin darse
# cuenta. Para subirlo, cambia `fail_under` en el mismo commit que agrega
# los tests; nunca lo bajes para que pase un cambio.
[tool.coverage.report]
fail_under = 67
precision = 1
