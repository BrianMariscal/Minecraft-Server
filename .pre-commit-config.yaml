# Ganchos que corren antes de cada commit.
# Instalación: uv run pre-commit install
minimum_pre_commit_version: "4.0.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Los .properties de Java NO se pueden limpiar: un espacio al final
        # SÍ significa algo. Por ejemplo, en el archivo de EssentialsX:
        #   chatTypeLocal=<dark_aqua>[L] <- separa la etiqueta del mensaje
        #   listGroupTag=<primary>{0}<reset>: <- separa el grupo de los nombres
        # Sin ese espacio sale "[L]Pepe » hola" y "Admins:Ana".
        exclude: \.properties$
      - id: end-of-file-fixer
      - id: check-yaml
        # Los templates de Jinja2 no son YAML válido hasta que se renderizan.
        exclude: ^minecraft/templates/
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: detect-private-key

  # Detección de secretos: evita que un token de Discord llegue a git.
  # La configuración está en .gitleaks.toml, que parte de TODAS las reglas
  # que trae gitleaks y solo permite los `discord_id` de settings.example.yml
  # (o settings.yml local), que son IDs de usuario (públicos), no tokens.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
        args: ["--config", ".gitleaks.toml"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.3
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (estricto)
        entry: uv run mypy packages
        language: system
        types: [python]
        pass_filenames: false
