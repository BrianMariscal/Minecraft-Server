[project]
name = "pagos-bot"
version = "1.0.0"
description = "Bot de Discord que cobra la mensualidad del VPS de Minecraft HD"
requires-python = ">=3.12"
dependencies = [
    "discord-py>=2.4.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "apscheduler>=3.11.0",
]

[project.scripts]
pagos-bot = "pagos_bot.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pagos_bot"]
