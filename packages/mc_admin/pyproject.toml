[project]
name = "mc-admin"
version = "1.1.0"
description = "CLI de administración del servidor Minecraft HD"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15.0",
    "rich>=13.9.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "ruamel-yaml>=0.18.10",
    "jinja2>=3.1.5",
    "httpx>=0.28.0",
    "mcrcon>=0.7.0",
]

[project.scripts]
mc = "mc_admin.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mc_admin"]
